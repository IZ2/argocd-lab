apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/IZ2/argocd-lab.git
    targetRevision: main
    path: charts/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
